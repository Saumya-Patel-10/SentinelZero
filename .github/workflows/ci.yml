name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, agent/** ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  baseline:
    name: Gate 0 — baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install Python dependencies
        run: |
          cd services/ai
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Install Node dependencies
        run: |
          npm ci --prefix packages/shared
          npm ci --prefix packages/spacetime
      - name: Typecheck and unit tests (spacetime)
        run: |
          npm run typecheck --prefix packages/spacetime
          npm run test:unit --prefix packages/spacetime
      - name: Python test suite
        run: |
          cd services/ai
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=python; fi
          "$PY" -m pytest -q
      - name: Web unit tests
        run: |
          cd apps/web
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm test
      - name: Simulator verify
        run: |
          python -m simulator verify

  nvidia:
    name: Gate 3 — NVIDIA (live, opt-in)
    runs-on: ubuntu-latest
    needs: baseline
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Python dependencies
        run: |
          cd services/ai
          python -m venv .venv
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=python; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -e ".[dev]"
      - name: Live NVIDIA inference test
        run: |
          cd services/ai
          if [ -x .venv/bin/python ]; then PY=.venv/bin/python; else PY=python; fi
          "$PY" -m pytest -m live -q
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          AI_LIVE_TESTS: "1"
